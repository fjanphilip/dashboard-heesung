<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Heesung · Monitoring Ionizer</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div>
        <h1>Monitoring Ionizer</h1>
        <p class="sub">LINE 1 · kontrol realtime via WT32</p>
      </div>
      <div class="badges">
        <span class="badge" id="brokerBadge"><i class="dot"></i>Broker</span>
        <span class="badge" id="wsBadge"><i class="dot"></i><span id="wsText">Menghubungkan</span></span>
        <span class="clock" id="clock">--:--:--</span>
      </div>
    </header>

    <section class="tiles" id="tiles">
      <button class="tile t-all" data-filter="all" type="button"><span>Total</span><strong id="cAll">0</strong></button>
      <button class="tile t-on" data-filter="on" type="button"><span>ON</span><strong id="cOn">0</strong></button>
      <button class="tile t-off" data-filter="off" type="button"><span>OFF</span><strong id="cOff">0</strong></button>
      <button class="tile t-down" data-filter="down" type="button"><span>Offline / belum terdeteksi</span><strong id="cDown">0</strong></button>
    </section>

    <section class="card map-card">
      <svg id="lineMap" viewBox="0 68 1640 190" role="img" aria-label="Denah line produksi dan posisi ionizer"></svg>
      <div class="legend">
        <span><i class="lg on"></i>ON</span>
        <span><i class="lg off"></i>OFF</span>
        <span><i class="lg offline"></i>Offline</span>
        <span><i class="lg na"></i>Belum terdeteksi</span>
        <span class="hint">Klik titik atau baris untuk membuka panel kontrol</span>
      </div>
    </section>

    <div class="main">
      <section class="card list-card">
        <div class="toolbar">
          <input id="search" class="search" type="search" placeholder="Cari ionizer atau proses…" aria-label="Cari" />
          <div class="chips" id="chips" role="tablist">
            <button class="chip active" data-filter="all" type="button">Semua</button>
            <button class="chip" data-filter="on" type="button">ON</button>
            <button class="chip" data-filter="off" type="button">OFF</button>
            <button class="chip" data-filter="down" type="button">Offline</button>
          </div>
          <div class="bulk">
            <button class="btn btn-on" id="bulkOn" type="button">Semua ON</button>
            <button class="btn btn-off" id="bulkOff" type="button">Semua OFF</button>
          </div>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th class="c-no">No</th>
                <th>Ionizer</th>
                <th>Type</th>
                <th>Perangkat</th>
                <th class="c-status">Status</th>
                <th class="c-ctl">Kontrol</th>
              </tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
          <p class="empty" id="emptyRow" hidden>Tidak ada ionizer yang cocok.</p>
        </div>
      </section>

      <aside class="card panel" id="panel" aria-live="polite"></aside>
    </div>

    <footer class="footer">
      <span id="unknownInfo" class="muted"></span>
      <span id="deviceCount" class="muted"></span>
    </footer>
  </div>

  <dialog id="confirm" class="dialog">
    <form method="dialog">
      <h3 id="confirmTitle"></h3>
      <p id="confirmText"></p>
      <div class="dialog-actions">
        <button class="btn btn-ghost" value="cancel">Batal</button>
        <button class="btn btn-primary" id="confirmOk" value="ok">Ya, lanjutkan</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/static/app.js"></script>
</body>
</html>
